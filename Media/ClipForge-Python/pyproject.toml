[project]
name = "clipforge"
version = "0.1.0"
description = "Local pipeline that turns gaming footage into narrated vertical short videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "faster-whisper>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "scenedetect>=0.7",
    "typer>=0.12",
    "uvicorn>=0.30",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
clipforge = "clipforge.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
